name: te-compare

# Same-test comparison: IndicConformer (current phone) vs Adalat AI Koyal te-120M
# Evaluates both on AI4Bharat Kathbath Telugu valid (60 clips) using sherpa-onnx 1.13.8.
# Measurement only - no pass/fail threshold. Manual dispatch only.

on:
  workflow_dispatch:

# Permissions: contents: write is required ONLY so github.token can query and list draft
# releases via GitHub REST API (models-2026-10-koyal-te). This job never receives
# AARIA_MODELS_SIGNING_KEY and uploads nothing to releases.
permissions:
  contents: write

jobs:
  compare:
    name: Telugu Models Comparison (Kathbath 60 clips)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "sherpa-onnx==1.13.8" "onnxruntime==1.20.1" soundfile datasets huggingface_hub httpx cryptography

      - name: Fetch Kathbath Telugu valid (60 clips)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/koyal_te/fetch_kathbath.py \
            --count 60 \
            --out-dir "build/eval_audio" \
            --manifest "build/eval_manifest.jsonl"

      - name: Download current phone model (models-2026-10)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/current_phone
          gh release download models-2026-10 \
            -p "manifest.json" \
            -p "manifest.json.sig" \
            -p "manifest_public_key.b64" \
            -p "te__model.int8.onnx" \
            -p "te__tokens.txt" \
            -D build/current_phone

      - name: Download Koyal model from draft release (models-2026-10-koyal-te)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/fetch_draft_assets.py \
            --tag "models-2026-10-koyal-te" \
            --assets "te-koyal__model.int8.onnx" "te-koyal__tokens.txt" "te-koyal__model.json" "te-koyal__LICENSE-koyal-te-120m.txt" \
            --out-dir "build/koyal"

      - name: Run ONNX Comparison
        run: |
          python scripts/koyal_te/score_onnx.py \
            --manifest "build/eval_manifest.jsonl" \
            --audio-dir "build/eval_audio" \
            --model-a "build/current_phone/te__model.int8.onnx" \
            --tokens-a "build/current_phone/te__tokens.txt" \
            --name-a "IndicConformer (current phone)" \
            --model-b "build/koyal/te-koyal__model.int8.onnx" \
            --tokens-b "build/koyal/te-koyal__tokens.txt" \
            --name-b "Koyal te-120M" \
            --verify-manifest "build/current_phone/manifest.json" \
            --out-results "compare_results.json"

      - name: Upload comparison artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-results
          path: compare_results.json
