name: te-switch

# Switch Telugu speech model between IndicConformer and Koyal te-120M in release models-2026-10.
# Updates models.te in signed manifest.json with ECDSA P-256 signature.
# Manual dispatch only. Defaults to dry_run: true.

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Target Telugu model (koyal or indicconformer)"
        options:
          - koyal
          - indicconformer
        required: true
      dry_run:
        type: boolean
        description: "Dry run (true: print diff and total only; false: apply switch)"
        default: true
        required: true

jobs:
  plan:
    name: "Plan switch (target: ${{ inputs.target }}, dry_run: ${{ inputs.dry_run }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Permissions: contents: write is required ONLY so github.token can query and list draft
    # releases via GitHub REST API (models-2026-10-koyal-te). This job never receives
    # AARIA_MODELS_SIGNING_KEY and uploads nothing to releases.
    permissions:
      contents: write
    outputs:
      noop: ${{ steps.build.outputs.noop }}
      manifest_sha256: ${{ steps.build.outputs.manifest_sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Download current manifest from release models-2026-10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current_rel
          gh release download models-2026-10 \
            -p "manifest.json" \
            -p "manifest.json.sig" \
            -p "manifest_public_key.b64" \
            -D current_rel

      - name: Verify CURRENT signature with public key
        run: |
          python scripts/switch/verify_manifest.py \
            --manifest current_rel/manifest.json \
            --sig current_rel/manifest.json.sig \
            --pubkey current_rel/manifest_public_key.b64

      - name: Download Koyal draft assets if target is koyal
        if: ${{ inputs.target == 'koyal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/fetch_draft_assets.py \
            --tag "models-2026-10-koyal-te" \
            --assets "te-koyal__model.int8.onnx" "te-koyal__tokens.txt" "te-koyal__model.json" "te-koyal__LICENSE-koyal-te-120m.txt" \
            --out-dir "draft_assets"

      - name: Build new switch manifest and show diff
        id: build
        run: |
          mkdir -p new_rel
          DRAFT_FLAG=""
          if [ "${{ inputs.target }}" = "koyal" ]; then
            DRAFT_FLAG="--draft-dir draft_assets"
          fi
          python scripts/switch/build_te_switch.py \
            --current current_rel/manifest.json \
            --target "${{ inputs.target }}" \
            $DRAFT_FLAG \
            --out new_rel/manifest.json

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-plan
          path: |
            current_rel/manifest.json
            current_rel/manifest.json.sig
            current_rel/manifest_public_key.b64
            new_rel/manifest.json
            new_rel/manifest.json.sha256

  apply:
    name: "Apply switch (target: ${{ inputs.target }})"
    if: inputs.dry_run == false
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: switch-plan
          path: plan_artifact

      - name: Stage current manifest from plan
        run: |
          mkdir -p current_rel
          cp plan_artifact/current_rel/manifest.json current_rel/manifest.json
          cp plan_artifact/current_rel/manifest.json.sig current_rel/manifest.json.sig
          cp plan_artifact/current_rel/manifest_public_key.b64 current_rel/manifest_public_key.b64

      - name: Check for no-op
        if: needs.plan.outputs.noop == 'true'
        run: |
          echo "No change - nothing to do"
          echo "Plan detected no change in models.te. Exiting cleanly without modifying release."

      - name: Download Koyal draft assets if target is koyal
        if: ${{ inputs.target == 'koyal' && needs.plan.outputs.noop != 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/fetch_draft_assets.py \
            --tag "models-2026-10-koyal-te" \
            --assets "te-koyal__model.int8.onnx" "te-koyal__tokens.txt" "te-koyal__model.json" "te-koyal__LICENSE-koyal-te-120m.txt" \
            --out-dir "draft_assets"

      - name: Apply switch in safe order
        id: apply_switch
        if: needs.plan.outputs.noop != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          AARIA_MODELS_SIGNING_KEY: ${{ secrets.AARIA_MODELS_SIGNING_KEY }}
        run: |
          python scripts/switch/apply_switch.py \
            --target "${{ inputs.target }}" \
            --current-dir current_rel \
            --plan-manifest plan_artifact/new_rel/manifest.json \
            --expected-sha256 "${{ needs.plan.outputs.manifest_sha256 }}" \
            --draft-dir draft_assets

      - name: Rollback on failure
        if: (failure() || cancelled()) && steps.apply_switch.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/rollback_switch.py \
            --current-dir current_rel \
            --release models-2026-10
