name: te-switch

# Switch Telugu speech model between IndicConformer and Koyal te-120M in release models-2026-10.
# Updates models.te in signed manifest.json with ECDSA P-256 signature.
# Manual dispatch only. Defaults to dry_run: true.

on:
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: "Target Telugu model (koyal or indicconformer)"
        options:
          - koyal
          - indicconformer
        required: true
      dry_run:
        type: boolean
        description: "Dry run (true: print diff and total only; false: apply switch)"
        default: true
        required: true

jobs:
  plan:
    name: "Plan switch (target: ${{ inputs.target }}, dry_run: ${{ inputs.dry_run }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Download current manifest from release models-2026-10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current_rel
          gh release download models-2026-10 \
            -p "manifest.json" \
            -p "manifest.json.sig" \
            -p "manifest_public_key.b64" \
            -D current_rel

      - name: Verify CURRENT signature with public key
        run: |
          python - <<'PY'
          import base64, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          manifest_bytes = Path("current_rel/manifest.json").read_bytes()
          sig_bytes = Path("current_rel/manifest.json.sig").read_bytes()
          pub_b64 = Path("current_rel/manifest_public_key.b64").read_text().strip()

          pub_der = base64.b64decode(pub_b64)
          pub_key = serialization.load_der_public_key(pub_der)

          try:
              pub_key.verify(sig_bytes, manifest_bytes, ec.ECDSA(hashes.SHA256()))
              print("SUCCESS: Current manifest signature verified with release public key.")
          except Exception as e:
              print(f"::error::Current manifest signature verification failed: {e}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Download Koyal draft assets if target is koyal
        if: ${{ inputs.target == 'koyal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/fetch_draft_assets.py \
            --tag "models-2026-10-koyal-te" \
            --assets "te-koyal__model.int8.onnx" "te-koyal__tokens.txt" "te-koyal__model.json" "te-koyal__LICENSE-koyal-te-120m.txt" \
            --out-dir "draft_assets"

      - name: Build new switch manifest and show diff
        run: |
          mkdir -p new_rel
          DRAFT_FLAG=""
          if [ "${{ inputs.target }}" = "koyal" ]; then
            DRAFT_FLAG="--draft-dir draft_assets"
          fi
          python scripts/switch/build_te_switch.py \
            --current current_rel/manifest.json \
            --target "${{ inputs.target }}" \
            $DRAFT_FLAG \
            --out new_rel/manifest.json

      - name: Upload plan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: switch-plan
          path: |
            current_rel/manifest.json
            current_rel/manifest.json.sig
            current_rel/manifest_public_key.b64
            new_rel/manifest.json

  apply:
    name: "Apply switch (target: ${{ inputs.target }})"
    if: inputs.dry_run == false
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography

      - name: Download current manifest from release models-2026-10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p current_rel
          gh release download models-2026-10 \
            -p "manifest.json" \
            -p "manifest.json.sig" \
            -p "manifest_public_key.b64" \
            -D current_rel

      - name: Download Koyal draft assets if target is koyal
        if: ${{ inputs.target == 'koyal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/switch/fetch_draft_assets.py \
            --tag "models-2026-10-koyal-te" \
            --assets "te-koyal__model.int8.onnx" "te-koyal__tokens.txt" "te-koyal__model.json" "te-koyal__LICENSE-koyal-te-120m.txt" \
            --out-dir "draft_assets"

      - name: Build new switch manifest
        run: |
          mkdir -p new_rel
          DRAFT_FLAG=""
          if [ "${{ inputs.target }}" = "koyal" ]; then
            DRAFT_FLAG="--draft-dir draft_assets"
          fi
          python scripts/switch/build_te_switch.py \
            --current current_rel/manifest.json \
            --target "${{ inputs.target }}" \
            $DRAFT_FLAG \
            --out new_rel/manifest.json

      - name: Apply switch in safe order
        env:
          GH_TOKEN: ${{ github.token }}
          AARIA_MODELS_SIGNING_KEY: ${{ secrets.AARIA_MODELS_SIGNING_KEY }}
          TARGET: ${{ inputs.target }}
        run: |
          echo "================================================================="
          echo "APPLYING TELEGRAPHED MODEL SWITCH (LIVE UPDATE)"
          echo "================================================================="

          upload_with_retry() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Upload attempt $attempt of $max_attempts: gh release upload $@"
              if gh release upload "$@"; then
                return 0
              fi
              echo "Upload attempt $attempt failed."
              if [ $attempt -lt $max_attempts ]; then
                sleep $delay
              fi
              attempt=$((attempt + 1))
            done
            echo "All $max_attempts upload attempts failed."
            return 1
          }

          # 1. No-op detection
          python - <<'PY'
          import json, sys
          from pathlib import Path
          c = json.loads(Path("current_rel/manifest.json").read_text(encoding="utf-8"))
          n = json.loads(Path("new_rel/manifest.json").read_text(encoding="utf-8"))
          if c.get("models", {}).get("te") == n.get("models", {}).get("te"):
              print("No change - nothing to do")
              sys.exit(200)
          PY
          NOOP_EXIT=$?
          if [ $NOOP_EXIT -eq 200 ]; then
            echo "No change detected in models.te. Exiting cleanly without modifying release."
            exit 0
          fi

          if [ -z "$AARIA_MODELS_SIGNING_KEY" ]; then
            echo "::error::AARIA_MODELS_SIGNING_KEY secret missing. Cannot sign manifest."
            exit 1
          fi

          # 2. Sign new manifest locally
          echo "Signing new manifest.json locally..."
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          pem = os.environ["AARIA_MODELS_SIGNING_KEY"].encode()
          k = serialization.load_pem_private_key(pem, password=None)
          data = Path("new_rel/manifest.json").read_bytes()
          sig = k.sign(data, ec.ECDSA(hashes.SHA256()))
          Path("new_rel/manifest.json.sig").write_bytes(sig)
          print("Signed new manifest.json successfully.")
          PY

          # 3. Verify new signature locally with public key BEFORE anything touches live release
          echo "Verifying new signature locally with manifest_public_key.b64..."
          python - <<'PY'
          import base64, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          manifest_bytes = Path("new_rel/manifest.json").read_bytes()
          sig_bytes = Path("new_rel/manifest.json.sig").read_bytes()
          pub_b64 = Path("current_rel/manifest_public_key.b64").read_text().strip()

          pub_der = base64.b64decode(pub_b64)
          pub_key = serialization.load_der_public_key(pub_der)

          try:
              pub_key.verify(sig_bytes, manifest_bytes, ec.ECDSA(hashes.SHA256()))
              print("PRE-UPLOAD LOCAL SIGNATURE VERIFIED: New signature is valid.")
          except Exception as e:
              print(f"::error::Pre-upload signature verification failed: {e}", file=sys.stderr)
              sys.exit(1)
          PY

          # 4. Only THEN upload Koyal files (if target is koyal)
          if [ "$TARGET" = "koyal" ]; then
            echo "Uploading exact 4 Koyal files to models-2026-10..."
            upload_with_retry models-2026-10 \
              draft_assets/te-koyal__model.int8.onnx \
              draft_assets/te-koyal__tokens.txt \
              draft_assets/te-koyal__model.json \
              draft_assets/te-koyal__LICENSE-koyal-te-120m.txt \
              --clobber

            # 5. Re-download Koyal files and check sha256 against new manifest
            echo "Re-downloading Koyal files and checking sha256..."
            mkdir -p verify_assets
            gh release download models-2026-10 \
              -p "te-koyal__model.int8.onnx" \
              -p "te-koyal__tokens.txt" \
              -p "te-koyal__model.json" \
              -p "te-koyal__LICENSE-koyal-te-120m.txt" \
              -D verify_assets \
              --clobber

            python - <<'PY'
            import hashlib, json, sys
            from pathlib import Path

            manifest = json.loads(Path("new_rel/manifest.json").read_text(encoding="utf-8"))
            te_files = manifest["models"]["te"]["files"]
            for f in te_files:
                asset_name = f["url"].split("/")[-1]
                path = Path("verify_assets") / asset_name
                if not path.is_file():
                    sys.exit(f"Missing verified asset: {asset_name}")
                h = hashlib.sha256(path.read_bytes()).hexdigest()
                if h != f["sha256"]:
                    sys.exit(f"SHA mismatch on {asset_name}: {h} vs {f['sha256']}")
                print(f"Verified {asset_name} SHA-256 match: {h}")
            PY
          fi

          # 6. Upload manifest-previous.json(.sig)
          cp current_rel/manifest.json new_rel/manifest-previous.json
          cp current_rel/manifest.json.sig new_rel/manifest-previous.json.sig
          echo "Uploading manifest-previous.json and manifest-previous.json.sig..."
          upload_with_retry models-2026-10 \
            new_rel/manifest-previous.json \
            new_rel/manifest-previous.json.sig \
            --clobber

          # 7. Upload new manifest.json.sig and manifest.json
          echo "Uploading new manifest.json.sig and manifest.json..."
          upload_with_retry models-2026-10 \
            new_rel/manifest.json.sig \
            new_rel/manifest.json \
            --clobber

          # 8. Exact after-check: download from public release and verify byte-for-byte equality and signature
          echo "Performing exact post-upload after-check..."
          mkdir -p post_verify
          gh release download models-2026-10 \
            -p "manifest.json" \
            -p "manifest.json.sig" \
            -D post_verify \
            --clobber

          python - <<'PY'
          import base64, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec

          downloaded_manifest = Path("post_verify/manifest.json").read_bytes()
          downloaded_sig = Path("post_verify/manifest.json.sig").read_bytes()

          expected_manifest = Path("new_rel/manifest.json").read_bytes()
          expected_sig = Path("new_rel/manifest.json.sig").read_bytes()

          # Byte-for-byte equality
          if downloaded_manifest != expected_manifest:
              sys.exit("EXACT AFTER-CHECK FAILED: downloaded manifest.json is not byte-for-byte equal to signed manifest!")

          if downloaded_sig != expected_sig:
              sys.exit("EXACT AFTER-CHECK FAILED: downloaded manifest.json.sig is not byte-for-byte equal to generated signature!")

          print("EXACT AFTER-CHECK PASSED: manifest.json and manifest.json.sig are byte-for-byte identical.")

          # Verify signature
          pub_b64 = Path("current_rel/manifest_public_key.b64").read_text().strip()
          pub_der = base64.b64decode(pub_b64)
          pub_key = serialization.load_der_public_key(pub_der)

          try:
              pub_key.verify(downloaded_sig, downloaded_manifest, ec.ECDSA(hashes.SHA256()))
              print("POST-UPLOAD SIGNATURE VERIFIED: Downloaded manifest verified with public key.")
          except Exception as e:
              sys.exit(f"POST-UPLOAD SIGNATURE VERIFICATION FAILED: {e}")
          PY

          echo "================================================================="
          echo "SWITCH SUCCESSFULLY EXECUTED AND VERIFIED."
          echo "================================================================="

      - name: Rollback on failure
        if: failure() && inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "================================================================="
          echo "FAILURE DETECTED: EXECUTING AUTOMATIC ROLLBACK TO PREVIOUS MANIFEST"
          echo "================================================================="

          upload_with_retry() {
            local max_attempts=3
            local delay=5
            local attempt=1
            while [ $attempt -le $max_attempts ]; do
              echo "Rollback upload attempt $attempt of $max_attempts: gh release upload $@"
              if gh release upload "$@"; then
                return 0
              fi
              echo "Upload attempt $attempt failed."
              if [ $attempt -lt $max_attempts ]; then
                sleep $delay
              fi
              attempt=$((attempt + 1))
            done
            echo "All $max_attempts rollback upload attempts failed."
            return 1
          }

          if [ -f "current_rel/manifest.json" ] && [ -f "current_rel/manifest.json.sig" ]; then
            echo "Re-uploading previous manifest.json and manifest.json.sig..."
            upload_with_retry models-2026-10 \
              current_rel/manifest.json \
              current_rel/manifest.json.sig \
              --clobber

            mkdir -p rollback_verify
            gh release download models-2026-10 \
              -p "manifest.json" \
              -p "manifest.json.sig" \
              -D rollback_verify \
              --clobber

            python - <<'PY'
            import base64, sys
            from pathlib import Path
            from cryptography.hazmat.primitives import hashes, serialization
            from cryptography.hazmat.primitives.asymmetric import ec

            manifest_bytes = Path("rollback_verify/manifest.json").read_bytes()
            sig_bytes = Path("rollback_verify/manifest.json.sig").read_bytes()
            pub_b64 = Path("current_rel/manifest_public_key.b64").read_text().strip()

            pub_der = base64.b64decode(pub_b64)
            pub_key = serialization.load_der_public_key(pub_der)

            try:
                pub_key.verify(sig_bytes, manifest_bytes, ec.ECDSA(hashes.SHA256()))
                print("Rollback manifest signature verified successfully.")
            except Exception as e:
                print(f"::error::Rollback signature verification failed: {e}", file=sys.stderr)
                sys.exit(1)
            PY

            echo "ROLLED BACK to previous manifest"
          else
            echo "::error::Cannot rollback: saved previous manifest files not found in current_rel/"
            exit 1
          fi
